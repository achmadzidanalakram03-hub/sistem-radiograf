<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Distribusi Gambar Radiograf - RSGM Unjani</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        /* Kontainer dibuat relatif agar canvas bisa bertumpuk tepat di atas gambar */
        #image-container { position: relative; display: inline-block; margin-top: 20px; }
        #radiograph-image { max-width: 100%; height: auto; border: 1px solid #ccc; display: block; }
        #overlay-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    </style>
</head>
<body>
    <b>Sistem Deteksi Distribusi Gambar Radiograf - RSGM Unjani</b><br><br>

    <input type="file" id="upload-btn" accept="image/*" capture="environment">
    <button id="predict-btn" disabled>Analisis Gambar</button>
    <br><br>
    
    <div id="status">Memuat model TFLite... (Tunggu sebentar)</div>

    <div id="image-container">
        <img id="radiograph-image" src="" style="display:none;">
        <canvas id="overlay-canvas"></canvas>
    </div>

    <script>
        let tfliteModel;
        const imageElement = document.getElementById('radiograph-image');
        const canvasElement = document.getElementById('overlay-canvas');
        const ctx = canvasElement.getContext('2d');

        async function loadModel() {
            try {
                tfliteModel = await tflite.loadTFLiteModel('./best.tflite');
                document.getElementById('status').innerText = 'Model berhasil dimuat! Silakan ambil foto radiograf.';
                document.getElementById('predict-btn').disabled = false;
            } catch (error) {
                document.getElementById('status').innerText = 'Gagal memuat model: ' + error.message;
            }
        }

       document.getElementById('predict-btn').addEventListener('click', () => {
            if (!tfliteModel || !imageElement.src) return;
            document.getElementById('status').innerText = 'Memproses inferensi...';

            let imgTensor = tf.browser.fromPixels(imageElement)
                .resizeBilinear([640, 640]) 
                .expandDims(0)
                .toFloat()
                .div(255.0)
                .transpose([0, 3, 1, 2]); 

            const outputTensor = tfliteModel.predict(imgTensor);
            const data = outputTensor.dataSync();
            const dims = outputTensor.shape; 
            
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            const xRatio = canvasElement.width / 640;
            const yRatio = canvasElement.height / 640;

            let numBoxes, numClasses;
            let isTransposed = false;

            // Deteksi otomatis orientasi matriks YOLO (8400x5 atau 5x8400)
            if (dims[1] > dims[2]) { 
                numBoxes = dims[1];
                numClasses = dims[2] - 4;
                isTransposed = true;
            } else { 
                numBoxes = dims[2];
                numClasses = dims[1] - 4;
            }

            let kotakTerdeteksi = 0;

            // Proses ekstraksi bounding box
            for (let i = 0; i < numBoxes; i++) {
                let maxConf = 0;
                let classId = -1;

                for (let c = 0; c < numClasses; c++) {
                    let confIndex = isTransposed ? 
                        (i * (4 + numClasses) + 4 + c) : 
                        ((4 + c) * numBoxes + i);
                    
                    let conf = data[confIndex];
                    if (conf > maxConf) {
                        maxConf = conf;
                        classId = c;
                    }
                }

                // Ambang batas keyakinan (turunkan ke 25% agar sensitif)
                if (maxConf > 0.25) {
                    let cx, cy, w, h;

                    if (isTransposed) {
                        let rowOffset = i * (4 + numClasses);
                        cx = data[rowOffset + 0];
                        cy = data[rowOffset + 1];
                        w = data[rowOffset + 2];
                        h = data[rowOffset + 3];
                    } else {
                        cx = data[0 * numBoxes + i];
                        cy = data[1 * numBoxes + i];
                        w = data[2 * numBoxes + i];
                        h = data[3 * numBoxes + i];
                    }

                    // Penyesuaian jika YOLO mengeluarkan output koordinat normalisasi (0.0 - 1.0)
                    if (cx <= 1.0 && cy <= 1.0) {
                        cx *= canvasElement.width;
                        cy *= canvasElement.height;
                        w *= canvasElement.width;
                        h *= canvasElement.height;
                    } else {
                        cx *= xRatio;
                        cy *= yRatio;
                        w *= xRatio;
                        h *= yRatio;
                    }

                    const x = cx - (w / 2);
                    const y = cy - (h / 2);

                    // Gambar Kotak Hijau
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, w, h);

                    // Gambar Teks Label
                    ctx.fillStyle = '#00FF00';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText(`Objek ${(maxConf * 100).toFixed(1)}%`, x, y > 20 ? y - 8 : y + 20);
                    
                    kotakTerdeteksi++;
                }
            }
            
            imgTensor.dispose();
            outputTensor.dispose();

            document.getElementById('status').innerText = `Proses selesai! Ditemukan ${kotakTerdeteksi} titik distribusi anatomi.`;
        });

        loadModel();
    </script>
</body>
</html>
